# Публикация сайта и ежедневное обновление меню из Яндекс Еды.
#
# - Любое изменение в репозитории (загрузка файлов, сохранение в админке)
#   сразу публикует сайт.
# - Каждый день в 06:00 по Москве робот сверяет меню с Яндекс Едой
#   (tools/sync_menu.py: цены, фото, новые блюда; правки из админки не трогает),
#   сохраняет изменения и публикует сайт.
# - Вручную: кнопка «Сверить с Яндекс Едой сейчас» в админке, вкладка
#   Actions → «Сайт» → Run workflow или любой коммит со словом [menu] в описании.

name: Сайт

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  menu:
    name: Меню из Яндекс Еды
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[menu]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Сверить меню и сохранить
        run: |
          git config user.name "menu-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Если, пока робот работал, кто-то сохранил правки в админке, push не пройдёт —
          # тогда берём свежую версию и сверяем заново поверх неё.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -fdq images/menu
            python tools/sync_menu.py
            git add -A data/menu.js data/menu-photos.json images/menu
            if git diff --cached --quiet; then
              echo "Меню не изменилось"
              exit 0
            fi
            git commit -q -m "Меню обновлено из Яндекс Еды"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "В репозитории появились новые правки, пробую ещё раз"
          done
          exit 1

  deploy:
    name: Публикация
    needs: menu
    # Публикуем и тогда, когда меню не удалось обновить: сайт остаётся с прошлым меню.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
